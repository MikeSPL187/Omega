<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3AA8FF}a:hover{color:#7CC5FF}
h2{margin:0 0 12px;font-size:18px;font-weight:700}
.rc{height:36px;padding:0 6px 0 12px;border-radius:999px;background:#1A222D;font-size:14px;display:inline-flex;align-items:center;gap:4px}
.rc button{width:28px;height:28px;border:0;background:none;color:#8693A3;padding:0;display:flex;align-items:center;justify-content:center}
.g{height:64px;border-radius:14px;display:flex;align-items:flex-end;padding:10px 12px;box-sizing:border-box;font-size:15px;font-weight:700}
.nav{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;color:#8693A3;text-decoration:none}
.nav i{width:56px;height:30px;border-radius:999px;display:flex;align-items:center;justify-content:center}
</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;background:#0A0D12;color:#F2F5F8;font-family:Onest,system-ui,sans-serif">

    <h1 style="margin:0 0 14px;font-size:28px;font-weight:800;letter-spacing:-.02em">Поиск</h1>

      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#A9B4C2" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
      <input type="search" placeholder="Фильмы, сериалы, актёры" aria-label="Поиск" style="flex:1;min-width:0;background:none;border:0;outline:0;color:#F2F5F8;font:500 16px Onest,sans-serif">
      <button type="button" aria-label="Голосовой поиск" style="width:44px;height:40px;border-radius:12px;border:0;background:#232D3A;color:#3AA8FF;display:flex;align-items:center;justify-content:center;padding:0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg></button>
    </label>
  </div>
  <div style="padding:22px 20px 0">
    <h2 style="display:flex;justify-content:space-between;align-items:baseline">Недавние<a href="#" style="font-size:13px;font-weight:600;text-decoration:none">Очистить</a></h2>
    <div style="display:flex;flex-wrap:wrap;gap:8px">
      <sc-for list="{{q}}" as="x" hint-placeholder-count="4">
        <span class="rc">{{x}}<button type="button" aria-label="Удалить запрос"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button></span>
      </sc-for>
    </div>
  </div>
  <div style="padding:24px 20px 0">
    <h2>Сейчас ищут</h2>
    <div style="display:flex;flex-direction:column;gap:10px">
      <sc-for list="{{top}}" as="t" hint-placeholder-count="3">
        <a href="content-new.dc.html" style="display:flex;align-items:center;gap:14px;color:#F2F5F8;text-decoration:none;min-height:44px">
          <span style="width:22px;font-size:20px;font-weight:800;color:#3AA8FF;text-align:center">{{t.n}}</span>
          <span style="flex:0 0 40px;height:58px;border-radius:8px;background:{{t.c}}"></span>
          <span style="flex:1;min-width:0"><span style="display:block;font-size:15px;font-weight:600">{{t.t}}</span><span style="display:block;font-size:13px;color:#8693A3">{{t.m}}</span></span>
        </a>
      </sc-for>
    </div>
  </div>
  <div style="padding:24px 20px 0">
    <h2>Жанры</h2>
    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">
      <span class="g" style="background:#3A2530">Драмы</span>
      <span class="g" style="background:#20354A">Фантастика</span>
    </div>
  </div>
  <div style="position:absolute;left:0;right:0;bottom:0;height:84px;background:rgba(10,13,18,.96);border-top:1px solid #1A222D;display:flex;align-items:flex-start;padding-top:10px;box-sizing:border-box">
    <a class="nav" href="home-new.dc.html"><i><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg></i>Главная</a>
    <a class="nav" href="catalog-new.dc.html"><i><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="2"></rect><rect x="13.5" y="3.5" width="7" height="7" rx="2"></rect><rect x="3.5" y="13.5" width="7" height="7" rx="2"></rect><rect x="13.5" y="13.5" width="7" height="7" rx="2"></rect></svg></i>Каталог</a>
    <a class="nav" href="search-new.dc.html" style="color:#F2F5F8"><i style="background:rgba(58,168,255,.18);color:#3AA8FF"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg></i>Поиск</a>
    <a class="nav" href="my-new.dc.html"><i><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.5h12V21l-6-4-6 4z"></path></svg></i>Моё</a>
    <a class="nav" href="profile-new.dc.html"><i><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg></i>Профиль</a>
  </div>
</div>
