<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Каталог — оригинал</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.nav{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:#909DAB}
.t{padding:12px 0;font-size:14px;color:#909DAB}
</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;background:#1E252B;color:#FFFFFF;font-family:Roboto,sans-serif">
  <div style="height:56px;display:flex;align-items:center;padding:0 16px;margin-top:24px;font-weight:900;font-size:20px">Каталог</div>
  <div style="display:flex;gap:20px;padding:0 16px;border-bottom:1px solid #3A4652">
    <div class="t" style="color:#FFFFFF;font-weight:500;border-bottom:2px solid #0094F6">Фильмы</div>
    <div class="t">Сериалы</div>
    <div class="t">ТВ-каналы</div>
    <div class="t">Спорт</div>
  </div>
  <div style="display:flex;gap:8px;padding:12px 16px">
    <div style="height:36px;padding:0 12px;border-radius:8px;background:#2C353E;display:flex;align-items:center;gap:8px;font-size:14px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" aria-hidden="true"><path d="M4 5h16l-6 8v6l-4-2v-4z"></path></svg>Фильтры</div>
    <div style="height:36px;padding:0 12px;border-radius:8px;background:#2C353E;display:flex;align-items:center;gap:8px;font-size:14px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" aria-hidden="true"><path d="M7 4v16M3 16l4 4 4-4M17 20V4M13 8l4-4 4 4"></path></svg>По популярности</div>
  </div>
  <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 8px;padding:0 16px">
    <sc-for list="{{items}}" as="it" hint-placeholder-count="9">
      <div style="display:flex;flex-direction:column;gap:4px">
        <div style="height:162px;border-radius:8px;background:{{it.c}}"></div>
        <div style="font-size:12px;color:#BBC2C7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{it.t}}</div>
      </div>
    </sc-for>
  </div>
  <div style="position:absolute;left:0;right:0;bottom:0;height:64px;background:#3A4652;display:flex;align-items:center">
    <div class="nav"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"></path></svg>Главная</div>
    <div class="nav" style="color:#0094F6"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"></rect></svg>Каталог</div>
    <div class="nav"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"></path></svg>Моё</div>
    <div class="nav"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>Поиск</div>
    <div class="nav"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>Профиль</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const c = ['#3A4652', '#2C353E', '#546778', '#262F36'];
    const items = [];
    for (let i = 0; i < 12; i++) items.push({ t: 'Название ' + (i + 1), c: c[i % 4] });
    return { items };
  }
}
</script>
</body>
</html>
