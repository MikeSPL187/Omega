<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Загрузки — оригинал</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;background:#1E252B;color:#FFFFFF;font-family:Roboto,sans-serif">
  <div style="height:56px;display:flex;align-items:center;gap:16px;padding:0 16px;margin-top:24px">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    <div style="font-weight:900;font-size:20px">Загрузки</div>
  </div>
  <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
    <div style="display:flex;gap:12px;padding:10px 16px;border-bottom:1px solid #262F36;align-items:center">
      <div style="flex:0 0 56px;height:80px;border-radius:8px;background:#3A4652"></div>
      <div style="flex:1;min-width:0">
        <div style="font-size:15px">{{r.t}}</div>
        <div style="font-size:12px;color:#909DAB;margin-top:4px">{{r.s}}</div>
        <div style="height:3px;background:#3A4652;margin-top:8px"><div style="height:100%;width:{{r.p}};background:#0094F6"></div></div>
      </div>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#909DAB" stroke-width="2" aria-hidden="true"><path d="M5 7h14M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path></svg>
    </div>
  </sc-for>
  <div style="position:absolute;left:16px;bottom:24px;font-size:12px;color:#909DAB">Свободно 12,4 ГБ</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { rows: [
      { t: 'Последний рейс', s: 'Загрузка 42%', p: '42%' },
      { t: 'Северный ветер 2 сезон 5 серия', s: 'Завершено 1,2 ГБ', p: '100%' },
      { t: 'Северный ветер 2 сезон 6 серия', s: 'Ожидание…', p: '0%' },
      { t: 'Маяк', s: 'Ошибка', p: '12%' }
    ] };
  }
}
</script>
</body>
</html>
