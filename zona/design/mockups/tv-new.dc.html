<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Android TV — редизайн</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.ri{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#8693A3}
</style>
</helmet>
<div style="width:960px;height:540px;position:relative;overflow:hidden;background:#0A0D12;color:#F2F5F8;font-family:Onest,system-ui,sans-serif">
  <div style="position:absolute;right:0;top:0;width:640px;height:360px;background:#2A3B4E"></div>
  <div style="position:absolute;right:120px;top:60px;width:260px;height:260px;border-radius:50%;background:#34506A"></div>
  <div style="position:absolute;right:30px;top:24px;font-size:11px;color:rgba(242,245,248,.5)">[обложка выбранного фильма]</div>
  <div style="position:absolute;right:0;top:0;width:640px;height:360px;background:linear-gradient(90deg,#0A0D12 0%,rgba(10,13,18,.6) 35%,rgba(10,13,18,0) 70%)"></div>
  <div style="position:absolute;left:0;right:0;top:220px;height:140px;background:linear-gradient(180deg,rgba(10,13,18,0),#0A0D12)"></div>

  <div style="position:absolute;left:0;top:0;bottom:0;width:76px;display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:22px;box-sizing:border-box">
    <svg width="26" height="27" viewBox="0 0 248 256" aria-hidden="true" style="margin-bottom:14px"><path d="M0,25.61C0,48.29 74.4,76.64 74.4,89.62C74.4,105.8 0,210.32 0,229.76C0,246.15 9.54,256 38.14,256H219.37C238.44,256 248,239.6 248,229.76C248,203.51 185.99,165.28 185.99,149.09C185.99,132.88 248,45.53 248,26.11C248,9.91 235.27,0.15 213.01,0.15C203.46,0.15 62.32,0 49.59,0C49.3,0 48.99,0 48.68,0C35.2,0 0,0.29 0,25.61Z" fill="#3AA8FF"></path></svg>
    <span class="ri"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg></span>
    <span class="ri" style="color:#3AA8FF;background:rgba(58,168,255,.16)"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg></span>
    <span class="ri"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 9h18M8 5v4M16 5v4"></path></svg></span>
    <span class="ri"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="2"></rect><rect x="13.5" y="3.5" width="7" height="7" rx="2"></rect><rect x="3.5" y="13.5" width="7" height="7" rx="2"></rect><rect x="13.5" y="13.5" width="7" height="7" rx="2"></rect></svg></span>
    <span class="ri"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="2" y="6" width="20" height="13" rx="2"></rect><path d="m8 2 4 4 4-4"></path></svg></span>
    <span class="ri"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.5h12V21l-6-4-6 4z"></path></svg></span>
    <span class="ri" style="margin-top:auto;margin-bottom:22px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg></span>
  </div>

  <div style="position:absolute;left:104px;top:44px;width:400px;display:flex;flex-direction:column;gap:10px">
    <span style="align-self:flex-start;background:#3DD68C;color:#04140C;font-weight:700;font-size:10px;letter-spacing:.04em;text-transform:uppercase;padding:3px 7px;border-radius:5px">Новый сезон</span>
    <div style="font-size:40px;line-height:1;font-weight:800;letter-spacing:-.02em">Северный ветер</div>
    <div style="display:flex;align-items:center;gap:8px;font-size:14px;color:#A9B4C2">
      <span style="background:#FFB547;color:#1A1200;font-weight:700;font-size:12px;padding:2px 6px;border-radius:5px">8.4</span>2025 · Драма, триллер · 18+ · 4K
    </div>
    <div style="font-size:14px;line-height:1.5;color:#C5CDD7">Короткое описание сюжета в две строки — его удобно прочитать с дивана, не открывая карточку.</div>
    <div style="display:flex;gap:10px;margin-top:6px">
      <span style="height:44px;padding:0 20px;border-radius:999px;background:#F2F5F8;color:#0A0D12;font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;box-shadow:0 0 0 3px rgba(58,168,255,.6)"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12-7.5z" fill="currentColor"></path></svg>Продолжить С2 · Е5</span>
      <span style="height:44px;padding:0 18px;border-radius:999px;background:rgba(242,245,248,.12);font-weight:600;font-size:15px;display:flex;align-items:center">Подробнее</span>
    </div>
  </div>

  <div style="position:absolute;left:104px;right:0;top:330px">
    <div style="font-size:17px;font-weight:700;margin-bottom:12px">Продолжить просмотр</div>
    <div style="display:flex;gap:16px;align-items:flex-start">
      <sc-for list="{{items}}" as="it" hint-placeholder-count="5">
        <div style="flex:0 0 {{it.w}};display:flex;flex-direction:column;gap:6px">
          <div style="height:{{it.h}};border-radius:12px;background:{{it.c}};box-shadow:{{it.ring}};position:relative;overflow:hidden">
            <div style="position:absolute;left:0;bottom:0;height:4px;width:{{it.p}};background:#3AA8FF"></div>
          </div>
          <div style="font-size:13px;font-weight:600;color:{{it.tc}}">{{it.t}}</div>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":960,"height":540}}'>
class Component extends DCLogic {
  renderVals() {
    const d = [['Северный ветер', '#3B2F45', '64%'], ['Тихая гавань', '#283B4F', '30%'], ['Маяк', '#2E4036', '80%'], ['Отлив', '#46382C', '12%'], ['Шторм', '#2B3A4A', '50%']];
    const items = d.map((x, i) => ({
      t: x[0], c: x[1], p: x[2],
      w: i === 0 ? '232px' : '200px', h: i === 0 ? '130px' : '112px',
      ring: i === 0 ? '0 0 0 3px #F2F5F8, 0 12px 30px rgba(0,0,0,.5)' : 'none',
      tc: i === 0 ? '#F2F5F8' : '#8693A3'
    }));
    return { items };
  }
}
</script>
</body>
</html>
