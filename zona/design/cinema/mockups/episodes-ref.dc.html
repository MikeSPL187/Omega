<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Сезоны и серии — новые</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&amp;family=Roboto+Condensed:wght@800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.glass{background:rgba(20,25,30,.55);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.ss{height:40px;padding:0 18px;border:0;border-radius:20px;font-family:inherit;font-size:14px;font-weight:700}
.ib{width:44px;height:44px;border:0;padding:0;background:none;color:#A7B1BC;display:flex;align-items:center;justify-content:center;flex:0 0 44px}
</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;background:#07090B;color:#F5F7FA;font-family:Roboto,sans-serif">
  <header style="margin-top:24px;height:56px;display:flex;align-items:center;gap:8px;padding:0 16px 0 8px">
    <a href="card-ref.dc.html" aria-label="Назад" style="width:44px;height:44px;color:#FFFFFF;display:flex;align-items:center;justify-content:center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <div style="flex:1"><div style="font-size:12px;color:#A7B1BC">Северный ветер</div><h1 style="margin:0;font-family:'Roboto Condensed',sans-serif;font-weight:800;font-size:24px;line-height:26px">Сезоны и серии</h1></div>
  </header>
  <div style="display:flex;gap:8px;padding:10px 16px 0">
    <button type="button" class="ss" aria-pressed="false" style="background:#1A2026;color:#FFFFFF">1 сезон</button>
    <button type="button" class="ss" aria-pressed="true" style="background:#FFFFFF;color:#07090B">2 сезон</button>
    <span style="flex:1"></span>
    <a href="streams-ref.dc.html" style="height:40px;padding:0 12px;border-radius:20px;background:#1A2026;color:#FFFFFF;text-decoration:none;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#A7B1BC" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg>LostFilm</a>
  </div>
  <div style="padding:14px 16px 6px;font-size:13px;color:#A7B1BC">9 серий · 4 просмотрено · новая каждую среду</div>

  <ul style="list-style:none;margin:0;padding:0 8px 0 16px;display:flex;flex-direction:column">
    <sc-for list="{{eps}}" as="e" hint-placeholder-count="6">
      <li style="display:flex;gap:12px;padding:10px 0;align-items:flex-start">
        <span style="flex:0 0 150px;height:84px;border-radius:12px;overflow:hidden;position:relative;background:#1A2026">
          <sc-if value="{{e.has}}" hint-placeholder-val="{{true}}"><img src="{{e.img}}" alt="" style="width:100%;height:100%;object-fit:cover;object-position:{{e.pos}};opacity:{{e.op}}"></sc-if>
          <sc-if value="{{e.soon}}" hint-placeholder-val="{{false}}"><span style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#A7B1BC;font-size:12px;font-weight:500"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"></rect><path d="M4 10h16M9 3v4M15 3v4"></path></svg>14 мая</span></sc-if>
          <sc-if value="{{e.cur}}" hint-placeholder-val="{{false}}"><span style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center"><span class="glass" style="width:36px;height:36px;border-radius:18px;display:flex;align-items:center;justify-content:center"><svg width="12" height="12" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4v16l14-8z" fill="#FFFFFF"></path></svg></span></span><span style="position:absolute;left:8px;right:8px;bottom:6px;height:3px;border-radius:2px;background:rgba(255,255,255,.3)"><span style="display:block;width:62%;height:100%;border-radius:2px;background:#0094F6"></span></span></sc-if>
          <sc-if value="{{e.seen}}" hint-placeholder-val="{{false}}"><span style="position:absolute;right:6px;top:6px;width:22px;height:22px;border-radius:11px;background:rgba(7,9,11,.85);display:flex;align-items:center;justify-content:center"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span></sc-if>
        </span>
        <span style="flex:1;min-width:0;padding-top:2px">
          <span style="display:block;font-size:15px;font-weight:700;color:{{e.tc}}">{{e.t}}</span>
          <span style="display:block;font-size:12px;color:{{e.mc}};margin-top:3px">{{e.m}}</span>
          <span style="display:block;font-size:12px;line-height:16px;color:#A7B1BC;margin-top:4px">{{e.d}}</span>
        </span>
        <button type="button" class="ib" aria-label="{{e.a}}" style="margin-top:-6px">
          <sc-if value="{{e.soon}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 21h4"></path></svg></sc-if>
          <sc-if value="{{e.has}}" hint-placeholder-val="{{true}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"></path></svg></sc-if>
        </button>
      </li>
    </sc-for>
  </ul>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const imgs = ['/_blob/6e2f60307f1eeedf9b9f16a3db98e077', '/_blob/0911f44fc4ff6ea40705d103e07947d5', '/_blob/c3da227365eeebc764996bd94f662bc1', '/_blob/24506806329586e5e175e40ace7653de'];
    const pos = ['20% 50%', '70% 40%', '45% 60%', '85% 50%'];
    const dates = ['', '12 марта', '19 марта', '26 марта', '2 апреля', '9 апреля', '16 апреля', '23 апреля', '30 апреля'];
    const eps = [];
    for (let i = 3; i <= 9; i++) {
      const seen = i < 5, cur = i === 5, soon = i === 9;
      eps.push({
        t: i + '. Серия ' + i, has: !soon, soon, cur, seen,
        img: imgs[i % 4], pos: pos[(i * 3) % 4], op: seen ? 0.5 : 1,
        tc: seen ? '#A7B1BC' : '#FFFFFF', mc: cur ? '#3DA9FF' : '#A7B1BC',
        m: cur ? 'Вы остановились · ещё 23 мин' : (soon ? 'Выйдет 14 мая' : '50 мин · ' + dates[i]),
        d: soon ? 'Напомним, когда серия выйдет.' : 'Короткое описание серии в одну-две строки.',
        a: soon ? 'Напомнить о серии ' + i : 'Скачать серию ' + i
      });
    }
    return { eps };
  }
}
</script>
</body>
</html>
