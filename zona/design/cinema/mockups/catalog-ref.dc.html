<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Каталог — новый</title>

</head>

<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&amp;family=Roboto+Condensed:wght@800&amp;family=Oswald:wght@700&amp;family=Unbounded:wght@800&amp;family=Playfair+Display:wght@800&amp;family=Russo+One&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.glass{background:rgba(20,25,30,.78);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.seg{flex:1;height:40px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:500;color:#A7B1BC;text-decoration:none}
.chip{height:36px;padding:0 12px;border:0;border-radius:18px;background:#1A2026;color:#FFFFFF;font-family:inherit;font-size:14px;font-weight:500;display:flex;align-items:center;gap:6px;white-space:nowrap;flex:0 0 auto}
.on{background:rgba(0,148,246,.18);box-shadow:inset 0 0 0 1px #0094F6}
.pt{position:absolute;left:5px;right:5px;bottom:9px;text-align:center;line-height:.95;text-transform:uppercase;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.nav{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:60px;font-size:11px;font-weight:500;color:#A7B1BC;text-decoration:none}
</style>
</helmet>

  <nav aria-label="Раздел каталога" style="margin:4px 16px 0;padding:4px;border-radius:24px;background:#111519;display:flex">

  </div>

  <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 10px;padding:0 16px">
    <sc-for list="{{items}}" as="p" hint-placeholder-count="9">
      <a href="card-ref.dc.html" style="display:flex;flex-direction:column;color:#F5F7FA;text-decoration:none;min-width:0">
        <span style="height:168px;border-radius:12px;overflow:hidden;position:relative;display:block">
          <img src="{{p.img}}" alt="" style="width:100%;height:100%;object-fit:cover">
          <span style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,9,11,0) 50%,rgba(7,9,11,.85) 100%)"></span>
          <span style="position:absolute;left:6px;top:6px;height:20px;padding:0 6px;border-radius:6px;background:rgba(7,9,11,.78);color:#FFB400;font-weight:700;font-size:12px;display:flex;align-items:center">{{p.r}}</span>
          <span class="pt" style="font-family:{{p.ff}};font-size:{{p.fs}};color:{{p.c}};letter-spacing:{{p.ls}}">{{p.t}}</span>
        </span>
        <span style="font-size:12px;color:#A7B1BC;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{p.m}}</span>
      </a>
    </sc-for>
  </div>

  <nav class="glass" style="position:absolute;left:12px;right:12px;bottom:16px;height:64px;border-radius:32px;display:flex;align-items:center;padding:0 6px">
    <a class="nav" href="home-ref.dc.html"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>Главная</a>
    <a class="nav" href="catalog-ref.dc.html" aria-current="page" style="color:#FFFFFF;font-weight:700"><svg width="24" height="24" viewBox="0 0 24 24" fill="#0094F6" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="2"></rect><rect x="13" y="4" width="7" height="7" rx="2"></rect><rect x="4" y="13" width="7" height="7" rx="2"></rect><rect x="13" y="13" width="7" height="7" rx="2"></rect></svg>Каталог</a>
    <a class="nav" href="my-ref.dc.html"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"></path></svg>Моё</a>
    <a class="nav" href="search-ref.dc.html"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>Поиск</a>
    <a class="nav" href="profile-ref.dc.html"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>Профиль</a>
  </nav>
</div>
