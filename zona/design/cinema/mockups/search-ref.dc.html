<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Поиск — новый</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&amp;family=Roboto+Condensed:wght@800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
input::placeholder{color:#A7B1BC;opacity:1}
.glass{background:rgba(20,25,30,.78);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.sec{display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 16px;height:44px}
.sec h2{margin:0;font-family:'Roboto Condensed',sans-serif;font-weight:800;font-size:20px}
.x{width:44px;height:44px;border:0;padding:0;background:none;color:#A7B1BC;display:flex;align-items:center;justify-content:center}
.nav{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:60px;font-size:11px;font-weight:500;color:#A7B1BC;text-decoration:none}
</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;background:#07090B;color:#F5F7FA;font-family:Roboto,sans-serif">
  <header style="margin-top:24px;height:56px;display:flex;align-items:center;padding:0 16px">
    <h1 style="margin:0;font-family:'Roboto Condensed',sans-serif;font-weight:800;font-size:28px">Поиск</h1>
  </header>
  <div style="padding:0 16px">
    <label for="q" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Поиск фильмов, сериалов и актёров</label>
    <div style="height:52px;border-radius:26px;background:#1A2026;display:flex;align-items:center;gap:10px;padding:0 4px 0 18px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A7B1BC" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
      <input id="q" type="search" placeholder="Фильмы, сериалы, актёры" style="flex:1;min-width:0;height:44px;border:0;background:none;color:#FFFFFF;font-family:inherit;font-size:16px;outline:none;padding:0">
      <button type="button" aria-label="Голосовой поиск" style="width:44px;height:44px;border:0;border-radius:22px;background:#252C34;color:#FFFFFF;display:flex;align-items:center;justify-content:center;padding:0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg></button>
    </div>
  </div>

  <div class="sec" style="margin-top:14px"><h2>Недавние</h2><button type="button" style="height:44px;padding:0 8px;border:0;background:none;color:#3DA9FF;font-family:inherit;font-size:14px;font-weight:500">Очистить</button></div>
  <ul style="list-style:none;margin:0;padding:0">
    <sc-for list="{{q}}" as="x" hint-placeholder-count="3">
      <li style="height:44px;display:flex;align-items:center;gap:12px;padding:0 4px 0 16px;font-size:15px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A7B1BC" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3.5 12a8.5 8.5 0 1 0 2.5-6M3.5 4v4h4M12 8v4l3 2"></path></svg><span style="flex:1">{{x.t}}</span><button type="button" class="x" aria-label="{{x.a}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button></li>
    </sc-for>
  </ul>

  <div class="sec" style="margin-top:10px"><h2>Жанры</h2></div>
  <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:4px 16px 0">
    <sc-for list="{{genres}}" as="g" hint-placeholder-count="6">
      <a href="catalog-ref.dc.html" style="height:84px;border-radius:16px;overflow:hidden;position:relative;color:#FFFFFF;text-decoration:none;display:block">
        <img src="{{g.img}}" alt="" style="width:100%;height:100%;object-fit:cover;object-position:{{g.pos}}">
        <span style="position:absolute;inset:0;background:linear-gradient(90deg,rgba(7,9,11,.82),rgba(7,9,11,.05))"></span>
        <span style="position:absolute;left:14px;bottom:12px;font-family:'Roboto Condensed',sans-serif;font-weight:800;font-size:19px">{{g.t}}</span>
      </a>
    </sc-for>
  </div>

  <nav class="glass" style="position:absolute;left:12px;right:12px;bottom:16px;height:64px;border-radius:32px;display:flex;align-items:center;padding:0 6px">
    <a class="nav" href="home-ref.dc.html"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>Главная</a>
    <a class="nav" href="catalog-ref.dc.html"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="2"></rect><rect x="13" y="4" width="7" height="7" rx="2"></rect><rect x="4" y="13" width="7" height="7" rx="2"></rect><rect x="13" y="13" width="7" height="7" rx="2"></rect></svg>Каталог</a>
    <a class="nav" href="my-ref.dc.html"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"></path></svg>Моё</a>
    <a class="nav" href="search-ref.dc.html" aria-current="page" style="color:#FFFFFF;font-weight:700"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0094F6" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>Поиск</a>
    <a class="nav" href="profile-ref.dc.html"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>Профиль</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const B = (id) => '/_blob/' + id;
    return {
      q: ['северный ветер', 'комедии 2024', 'тихая гавань'].map((t) => ({ t, a: 'Удалить запрос «' + t + '»' })),
      genres: [
        { t: 'Драмы', img: B('c3da227365eeebc764996bd94f662bc1'), pos: '50% 60%' },
        { t: 'Триллеры', img: B('722123bb05a399933b835469597b760e'), pos: '50% 50%' },
        { t: 'Фантастика', img: B('3c991e960a9fa3b9b1449ef155ecac32'), pos: '70% 40%' },
        { t: 'Приключения', img: B('84ee289e75263fb0537bb961a844fef3'), pos: '50% 50%' },
        { t: 'Детективы', img: B('6e2f60307f1eeedf9b9f16a3db98e077'), pos: '25% 50%' },
        { t: 'Боевики', img: B('2064757da816625003079ad641be6eca'), pos: '40% 50%' }
      ]
    };
  }
}
</script>
</body>
</html>
