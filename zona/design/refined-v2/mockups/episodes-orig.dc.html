<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Сезоны и серии — оригинал</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;background:#1E252B;color:#FFFFFF;font-family:Roboto,sans-serif">
  <div style="height:56px;display:flex;align-items:center;gap:16px;padding:0 16px;margin-top:24px">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    <div style="font-weight:900;font-size:20px">Сезоны и серии</div>
  </div>
  <div style="display:flex;padding:0 16px;gap:16px;border-bottom:1px solid #3A4652">
    <div style="padding:12px 0;font-size:14px;font-weight:500;border-bottom:2px solid #0094F6">Сезон 1</div>
    <div style="padding:12px 0;font-size:14px;color:#909DAB">Сезон 2</div>
  </div>
  <div style="display:flex;flex-direction:column">
    <sc-for list="{{eps}}" as="e" hint-placeholder-count="10">
      <div style="height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid #262F36">
        <div style="font-size:16px;color:{{e.c}}">{{e.t}}</div>
        <sc-if value="{{e.w}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#909DAB" stroke-width="2" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></sc-if>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const eps = [];
    for (let i = 1; i <= 11; i++) eps.push({ t: i + ' серия', w: i < 5, c: i < 5 ? '#909DAB' : '#FFFFFF' });
    return { eps };
  }
}
</script>
</body>
</html>
