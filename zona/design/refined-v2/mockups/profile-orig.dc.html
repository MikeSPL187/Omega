<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Профиль — оригинал</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.nav{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:#909DAB}
.m{height:52px;display:flex;align-items:center;gap:16px;padding:0 16px;font-size:16px}
</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;background:#1E252B;color:#FFFFFF;font-family:Roboto,sans-serif">
  <div style="height:56px;display:flex;align-items:center;padding:0 16px;margin-top:24px;font-weight:900;font-size:20px">Профиль</div>
  <div style="display:flex;align-items:center;gap:12px;padding:8px 16px 16px">
    <div style="width:56px;height:56px;border-radius:28px;background:#546778"></div>
    <div><div style="font-weight:700;font-size:16px">user@mail.ru</div><div style="font-size:13px;color:#909DAB">Профиль Zona</div></div>
  </div>
  <div style="margin:0 16px 12px;padding:16px;border-radius:12px;background:#2C353E">
    <div style="font-weight:900;font-size:16px">Новые возможности с премиум профилем</div>
    <div style="font-size:13px;color:#909DAB;margin-top:6px">Смотрите фильмы и сериалы без рекламы!</div>
    <div style="margin-top:12px;height:40px;border-radius:8px;background:#0094F6;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px">Посмотреть тарифы</div>
  </div>
  <sc-for list="{{m}}" as="x" hint-placeholder-count="6">
    <div class="m"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#909DAB" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle></svg><span style="flex:1">{{x}}</span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#909DAB" stroke-width="2" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></div>
  </sc-for>
  <div style="position:absolute;left:0;right:0;bottom:0;height:64px;background:#3A4652;display:flex;align-items:center">
    <div class="nav"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"></path></svg>Главная</div>
    <div class="nav"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"></rect><path d="M4 9h16M9 4v16"></path></svg>Каталог</div>
    <div class="nav"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"></path></svg>Моё</div>
    <div class="nav"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>Поиск</div>
    <div class="nav" style="color:#0094F6"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6z"></path></svg>Профиль</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return { m: ['Управление профилем', 'Загрузки', 'Настройки', 'Настройки плеера', 'Сообщить о проблеме', 'Рекомендовать Zona'] }; }
}
</script>
</body>
</html>
