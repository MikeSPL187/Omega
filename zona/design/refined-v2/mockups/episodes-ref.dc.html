<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Сезоны и серии — доработка</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.ib{width:44px;height:44px;border:0;padding:0;background:none;color:#A3AFBC;display:flex;align-items:center;justify-content:center;border-radius:22px;flex:0 0 44px}
.ss{height:40px;padding:0 16px;border:0;border-radius:20px;font-family:inherit;font-size:14px;font-weight:500;display:flex;align-items:center}
</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;background:#1E252B;color:#FFFFFF;font-family:Roboto,sans-serif">
  <header style="height:56px;margin-top:24px;display:flex;align-items:center;gap:4px;padding:0 16px 0 4px">
    <a href="card-ref.dc.html" class="ib" aria-label="Назад" style="color:#FFFFFF"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <div style="flex:1;min-width:0">
      <h1 style="margin:0;font-weight:900;font-size:20px;line-height:24px">Сезоны и серии</h1>
      <div style="font-size:13px;color:#A3AFBC">Северный ветер</div>
    </div>
  </header>

  <div style="display:flex;gap:8px;padding:8px 16px 0">
    <button type="button" class="ss" aria-pressed="true" style="background:rgba(0,148,246,.16);box-shadow:inset 0 0 0 1px #0094F6;color:#FFFFFF">1 сезон</button>
    <button type="button" class="ss" style="background:#2C353E;color:#BBC2C7">2 сезон</button>
  </div>
  <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px 8px">
    <span style="font-size:13px;color:#A3AFBC">11 серий · 4 просмотрено</span>
    <a href="streams-ref.dc.html" style="height:36px;padding:0 10px 0 12px;border-radius:18px;background:#262F36;color:#FFFFFF;text-decoration:none;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A3AFBC" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg>LostFilm<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#A3AFBC" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></a>
  </div>

  <ul style="list-style:none;margin:0;padding:0 8px;display:flex;flex-direction:column;gap:2px">
    <sc-for list="{{eps}}" as="e" hint-placeholder-count="8">
      <li style="display:flex;align-items:center;gap:12px;padding:8px 0 8px 8px;border-radius:12px;background:{{e.rowBg}}">
        <span style="flex:0 0 128px;height:72px;border-radius:8px;overflow:hidden;position:relative;background:#2C353E">
          <sc-if value="{{e.dl}}" hint-placeholder-val="{{true}}"><img src="{{e.img}}" alt="" style="width:100%;height:100%;object-fit:cover;object-position:{{e.pos}};opacity:{{e.op}}"></sc-if>
          <sc-if value="{{e.soon}}" hint-placeholder-val="{{false}}"><span style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#A3AFBC"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"></rect><path d="M4 10h16M9 3v4M15 3v4"></path></svg></span></sc-if>
          <sc-if value="{{e.watched}}" hint-placeholder-val="{{false}}">
            <span style="position:absolute;right:6px;bottom:6px;width:22px;height:22px;border-radius:11px;background:rgba(23,30,35,.85);display:flex;align-items:center;justify-content:center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#26C442" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span>
          </sc-if>
          <sc-if value="{{e.current}}" hint-placeholder-val="{{false}}">
            <span style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center"><span style="width:32px;height:32px;border-radius:16px;background:rgba(23,30,35,.78);display:flex;align-items:center;justify-content:center"><svg width="12" height="12" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4v16l14-8z" fill="#FFFFFF"></path></svg></span></span>
            <span style="position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.28)"><span style="display:block;width:62%;height:100%;background:#0094F6"></span></span>
          </sc-if>
        </span>
        <span style="flex:1;min-width:0">
          <span style="display:block;font-size:15px;font-weight:500;color:{{e.tc}}">Серия {{e.n}}</span>
          <span style="display:block;font-size:13px;color:{{e.mc}};margin-top:4px">{{e.m}}</span>
        </span>
        <button type="button" class="ib" aria-label="{{e.aria}}">
          <sc-if value="{{e.soon}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 21h4"></path></svg></sc-if>
          <sc-if value="{{e.dl}}" hint-placeholder-val="{{true}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"></path></svg></sc-if>
        </button>
      </li>
    </sc-for>
  </ul>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const imgs = ['/_blob/6e2f60307f1eeedf9b9f16a3db98e077', '/_blob/0911f44fc4ff6ea40705d103e07947d5', '/_blob/c3da227365eeebc764996bd94f662bc1', '/_blob/24506806329586e5e175e40ace7653de'];
    const pos = ['20% 50%', '70% 40%', '45% 60%', '85% 50%'];
    const dates = ['12 мар', '12 мар', '19 мар', '26 мар', '2 апр', '9 апр', '16 апр', '23 апр', '30 апр', '7 мая'];
    const eps = [];
    for (let i = 1; i <= 11; i++) {
      const watched = i < 5, current = i === 5, soon = i === 11;
      eps.push({
        n: i,
        img: imgs[i % 4],
        pos: pos[(i * 3) % 4],
        op: watched ? 0.55 : 1,
        watched, current, soon, dl: !soon,
        rowBg: current ? '#262F36' : 'transparent',
        tc: watched ? '#A3AFBC' : '#FFFFFF',
        mc: current ? '#2FA8FF' : '#A3AFBC',
        m: current ? 'Вы остановились · ещё 23 мин' : (soon ? 'Выйдет 14 мая' : '50 мин · ' + dates[i - 1]),
        aria: soon ? 'Напомнить о выходе серии ' + i : 'Скачать серию ' + i
      });
    }
    return { eps };
  }
}
</script>
</body>
</html>
