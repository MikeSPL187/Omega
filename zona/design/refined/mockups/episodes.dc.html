<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Сезоны и серии</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.t{height:48px;display:flex;align-items:center;font-size:14px;font-weight:500;color:#909DAB;border-bottom:2px solid transparent;white-space:nowrap}
</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;background:#1E252B;color:#FFFFFF;font-family:Roboto,sans-serif">
  <div style="height:56px;display:flex;align-items:center;padding:0 8px 0 4px;margin-top:24px">
    <a href="card.dc.html" aria-label="Назад" style="width:48px;height:48px;color:#FFFFFF;display:flex;align-items:center;justify-content:center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <div style="flex:1"><div style="font-weight:900;font-size:20px;line-height:24px">Сезоны и серии</div><div style="font-size:12px;color:#909DAB">Северный ветер</div></div>
  </div>
  <div style="display:flex;gap:24px;padding:0 16px;border-bottom:1px solid #3A4652">
    <span class="t">Сезон 1 <span style="margin-left:6px;color:#26C442">✓</span></span>
    <span class="t" style="color:#FFFFFF;border-bottom-color:#0094F6">Сезон 2</span>
  </div>
  <div style="display:flex;flex-direction:column;padding:8px 0">
    <sc-for list="{{eps}}" as="e" hint-placeholder-count="7">
      <div style="display:flex;gap:12px;align-items:center;padding:8px 16px;background:{{e.bg}}">
        <div style="flex:0 0 120px;height:68px;border-radius:8px;overflow:hidden;position:relative">
          <img src="{{e.img}}" alt="" style="width:100%;height:100%;object-fit:cover;opacity:{{e.o}}">
          <span style="position:absolute;right:4px;bottom:7px;height:18px;padding:0 4px;border-radius:4px;background:rgba(23,30,35,.85);font-size:11px;display:flex;align-items:center">{{e.d}}</span>
          <span style="position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.2)"><span style="display:block;height:100%;width:{{e.p}};background:#0094F6"></span></span>
        </div>
        <div style="flex:1;min-width:0">
          <div style="font-size:15px;font-weight:500;color:{{e.tc}}">{{e.t}}</div>
          <div style="font-size:12px;color:{{e.sc}};margin-top:3px">{{e.s}}</div>
        </div>
        <button type="button" aria-label="Скачать серию" style="width:44px;height:44px;border:0;background:none;color:#909DAB;display:flex;align-items:center;justify-content:center;padding:0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"></path></svg></button>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const imgs = ['/_blob/48adb861b9d2eb2ba1603f9c8462c123', '/_blob/0357633397ba4cabd5190a574baf6a5f', '/_blob/e894018837b111395774fb1fb5f60de9', '/_blob/da55566034a1709102169b8a39af574e', '/_blob/304e0ba72379dd7c31bf374a1e54b6a8', '/_blob/543b82bb6717020f9d8f9340ce1bd597', '/_blob/18ff34dad46238821d718a826ad204a3'];
    const names = ['Возвращение', 'Переправа', 'Маяк', 'Тишина', 'Чужой берег', 'Шторм', 'Отлив'];
    const eps = names.map((n, i) => {
      const k = i + 1, done = k < 5, now = k === 5;
      return {
        t: k + ' серия · ' + n, img: imgs[i], d: (46 + (i % 3) * 3) + ' мин',
        p: done ? '100%' : now ? '64%' : '0%', o: done ? '.6' : '1',
        s: done ? 'Просмотрено' : now ? 'Смотрите сейчас · ещё 23 мин' : (10 + i * 7) + ' апреля',
        sc: done ? '#909DAB' : now ? '#0094F6' : '#909DAB',
        tc: done ? '#BBC2C7' : '#FFFFFF',
        bg: now ? '#262F36' : 'transparent'
      };
    });
    return { eps };
  }
}
</script>
</body>
</html>
