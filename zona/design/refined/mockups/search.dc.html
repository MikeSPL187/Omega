    </sc-for>

  <div style="padding:20px 16px 10px"><h2>Жанры</h2></div>
  <div style="display:flex;flex-wrap:wrap;gap:8px;padding:0 16px">

    <a class="nav" href="my.dc.html"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"></path></svg>Моё</a>

  </nav>
</div>
